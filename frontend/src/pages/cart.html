<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <title>Your Cart - Peerly</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/cart.css" />
</head>
<body>
<header id="navbar"></header>

<main class="cart-page container">
    <header class="cart-header">
        <h1 id="cart-heading">Your Cart</h1>
        <p id="cart-count-text">Loading...</p>
    </header>

    <section id="empty-cart-state" class="empty-state" style="display: none;">
        <img src="../assets/icons/cart.svg" class="inline-icon empty-icon" aria-hidden="true" alt="Shopping Cart">
        <h2>Your cart is empty</h2>
        <p>Looks like you haven’t added anything to your cart yet.</p>
        <a href="../pages/listings.html" class="btn btn-primary btn-lg">Continue Shopping</a>
    </section>

    <div id="cart-layout" class="cart-layout" style="display: none;">
        <section class="cart-items-section" aria-labelledby="cart-heading">
            <ul id="cart-items-list" class="cart-items-list">
            </ul>
        </section>

        <aside id="order-summary-mount"></aside>
    </div>
</main>

<footer id="footer"></footer>
<script type="module" src="cart.js"></script>
</body>
</html>
