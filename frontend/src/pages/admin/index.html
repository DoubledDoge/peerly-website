<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <title>Admin Dashboard - Peerly</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/pages/admin/index.css" />
</head>

<body>
<header id="navbar"></header>

<main class="container">
  <header class="dashboard-header">
    <div>
      <h1>Dashboard</h1>
      <p>Welcome back, <strong id="admin-name">Admin</strong>. Role: <span id="admin-role-badge"></span></p>
    </div>
  </header>

  <section class="metrics-grid">
    <div class="metric-card" id="metric-users">
      <div class="metric-icon"><img src="../../assets/icons/user.svg" class="inline-icon" alt="Users Icon"></div>
      <div class="metric-info">
        <h3>Total Users</h3>
        <p class="metric-value metric-value-loading" id="metric-users-value">—</p>
      </div>
    </div>

    <div class="metric-card" id="metric-listings">
      <div class="metric-icon"><img src="../../assets/icons/package.svg" class="inline-icon" alt="Listings Icon"></div>
      <div class="metric-info">
        <h3>Active Listings</h3>
        <p class="metric-value metric-value-loading" id="metric-listings-value">—</p>
      </div>
    </div>

    <div class="metric-card" id="metric-orders">
      <div class="metric-icon"><img src="../../assets/icons/cart.svg" class="inline-icon" alt="Orders Icon"></div>
      <div class="metric-info">
        <h3>Total Orders</h3>
        <p class="metric-value metric-value-loading" id="metric-orders-value">—</p>
      </div>
    </div>

    <div class="metric-card" id="metric-reports">
      <div class="metric-icon"><img src="../../assets/icons/alert-triangle.svg" alt="Reports Icon"></div>
      <div class="metric-info">
        <h3>Open Reports</h3>
        <p class="metric-value metric-value-loading" id="metric-reports-value">—</p>
      </div>
    </div>
  </section>

  <h2>Quick Actions</h2>

  <section class="dashboard-grid" id="admin-navigation">
    <a href="./users.html" class="btn btn-outline dashboard-card-btn" data-allowed-roles="admin">
      <img src="../../assets/icons/user-circle.svg" class="inline-icon" alt="Users Icon" width="32" height="32">
      Manage Users
    </a>

    <a href="./listings.html" class="btn btn-outline dashboard-card-btn" data-allowed-roles="admin,moderator">
      <img src="../../assets/icons/package.svg" class="inline-icon" alt="Listings Icon" width="32" height="32">
      Manage Listings
    </a>

    <a href="./orders.html" class="btn btn-outline dashboard-card-btn" data-allowed-roles="admin,moderator">
      <img src="../../assets/icons/cart.svg" class="inline-icon" alt="Orders Icon" width="32" height="32">
      View Orders
    </a>

    <a href="./reports.html" class="btn btn-outline dashboard-card-btn" data-allowed-roles="admin,moderator">
      <img src="../../assets/icons/shield.svg" class="inline-icon" alt="Reports Icon" width="32" height="32">
      Review Reports
      <span class="report-badge" id="report-badge" style="display: none;"></span>
    </a>
  </section>
</main>

<footer id="footer"></footer>
<script type="module" src="index.js"></script>
</body>
</html>
