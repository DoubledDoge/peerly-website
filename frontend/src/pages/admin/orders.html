<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Manage Orders - Peerly</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="../../styles/main.css" />
    <link rel="stylesheet" href="../../styles/pages/admin/orders.css" />
</head>
<body>
<header id="navbar"></header>

<main class="container" style="padding-block: 4rem; min-height: 60vh;">
    <header class="section-header">
        <div>
            <h1>Manage Orders</h1>
            <p>Track and update customer transactions across the platform.</p>
        </div>
        <a href="index.html" class="btn btn-outline btn-sm">Back to Dashboard</a>
    </header>

    <div id="orders-container" style="overflow-x: auto;"></div>
</main>

<footer id="footer"></footer>
<script type="module" src="orders.js"></script>
</body>
</html>
