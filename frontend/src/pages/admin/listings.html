<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <title>Manage Listings - Peerly</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link href="../../styles/main.css" rel="stylesheet" />
    <link href="../../styles/pages/admin/listings.css" rel="stylesheet" />
</head>
<body>
<header id="navbar"></header>

<main class="container" style="padding-block: 4rem; min-height: 60vh;">
    <header class="section-header">
        <div>
            <h1>Manage Listings</h1>
            <p>Overview of all products across the platform.</p>
        </div>
        <a class="btn btn-outline btn-sm" href="index.html">Back to Dashboard</a>
    </header>

    <div id="listings-container" style="overflow-x: auto;"></div>
</main>

<footer id="footer"></footer>
<script src="listings.js" type="module"></script>
</body>
</html>
